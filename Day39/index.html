<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day_39_Password_Generator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Password Generator</h2>

        <div class="password-box">
            <input type="text" id="password" readonly>
            <button class="copy" onclick="copyPassword()">Copy</button>
        </div>

        <div class="range-box">
            <label>Password Length:
                <span id="lengthValue">12</span>
            </label>

            <input type="range" min="6" max="30" value="12" id="length" style="width:100%;">
        </div>

        <button class="generate" onclick="generatePassword()">
            Generate Password
        </button>
    </div>

<script src="js/script.js"></script>
</body>
</html>
