<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 26 _ Mobile tab navigation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
     <div class="phoneCase">
        <div class="phone-grid">
            <div class="phone-top">

                <button class="top-shape-one"></button>
                <button class="top-shape-two"></button>
                <button class="top-shape-three"></button>

            </div>

            <div class="phone-middle">
                <input type="search" placeholder="Search local files">

                <div class="middle-grid">
                    <div class="bg-one app" id="face">
                        F
                    </div>

                    <div class="bg-two app" id="Tik">
                        T
                    </div>

                    <div class="bg-three app" id="Ins">
                        I
                    </div>

                    <div class="bg-four app" id="audio">
                        A
                    </div>

                    <div class="bg-five app" id="game">
                        G
                    </div>

                </div>
            </div>


            <div class="phone-bottom">
                <button class="bottom-shape-one" id="menu"></button>
                <button class="bottom-shape-two " id="home"></button>
                <button class="bottom-shape-three" id="back"></button>

            </div>
        </div>
    </div>



    

    <!-- ==============
        Menu list
        ========
     -->
    <div class="menu-List" id="list">
        <div class="audio">
            🎶
        </div>
        <div class="game">
            🎮
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
