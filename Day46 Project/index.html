<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 46 - Art Gallery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        Art Gallery
    </header>

    <section class="hero">
        <div>
            <h1>Creative Art Collection</h1>
            <p>Discover amazing digital artworks.</p>
        </div>
    </section>

    <section class="gallery">

        <div class="card">
            <img src="" onclick="openLightbox(this.src)" alt="">
            <div class="card-content">
                <h3>Abstract Dreams</h3>
                <p>Digital art work inspired by imagination.</p>
            </div>
        </div>

        <div class="card">
            <img src="" onclick="openLightbox(this.src)" alt="">
            <div class="card-content">
                <h3>Golden Sunset</h3>
                <p>Beautiful landscape painting.</p>
            </div>
        </div>

        <div class="card">
            <img src="" onclick="openLightbox(this.src)" alt="">
            <div class="card-content">
                <h3>Modern Vision</h3>
                <p>Contempoary art expresion.</p>
            </div>
        </div>

        <div class="card">
            <img src="art4.jpg" onclick="openLightbox(this.src)">
            <div class="card-content">
                <h3>Ocean Light</h3>
                <p>Inspired by nature and water.</p>
            </div>
        </div>

    </section>

    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeLightbox()">
            &times;
        </span>

        <img id="lightboxImg">
    </div>

    <footer>
        © 2026 Art Gallery
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
