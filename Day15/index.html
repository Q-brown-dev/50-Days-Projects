<!DOCTYPE html>
<html lang="en">
<head>

    <title>Day 15 _  Trigonometri calculator </title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Trigonometric calculator</h2>
        <input type="number" id="input" class="input">
        <br>
        <div class="buttons">
            <button onclick="calculateTrig('sin')">sin</button>
            <button onclick="calculateTrig('cos')">Cos</button>

        </div>
        <div class="result" id="result"></div>
    </div>
    <script src="js/script.js"></script>
</body>
