<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15_ Contact Form</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="container">
        <section class="section-lg">
            <h1 class="section-title">Get in touch
                <p class="lead">Tell us about your project — we’ll reply within 24 hours.</p>
                <form class="contact-form" id="contactForm">
                    <div class="form-grid">
                        <input type="text" name="name" placeholder="Full name" required>
                        <input type="email" name="email" placeholder="Email address" required>
                    </div>
                    <input type="text" name="subject" placeholder="Subject" required>
                    <textarea name="message" rows="6" placeholder="Describe your project" required></textarea>
                    <div class="form-actions">
                        <button type="submit" class="btn">Send Message</button>
                        <div id="formMsg" class="muted"></div>
                    </div>
                </form>
            </h1>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
