<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 45 - Luxury Shop</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <header>

        <div class="logo">
            Luxury Shop
        </div>

        <div class="cart">
            🛒 Cart:
            <span id="cartCount">0</span>
        </div>

    </header>

    <section class="hero">

        <div class="hero-content">

            <h1>Luxury Fashion Collection</h1>

            <p>Discover premium products.</p>

            <button>Shop Now</button>

        </div>

    </section>

    <section class="products">

        <h2>Featured Products</h2>

        <div class="product-grid">

            <div class="product">

                <img src="Img/Classic jacket.png">

                <h3>Luxury Jacket</h3>

                <div class="price">$120</div>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>

            <div class="product">

                <img src="Img/New season.png">

                <h3>Designer Shoes</h3>

                <div class="price">$95</div>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>

            <div class="product">

                <img src="Img/Acessories.png">

                <h3>Premium Watch</h3>

                <div class="price">$180</div>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>

            <div class="product">

                <img src="Img/Bag Product.png">

                <h3>Luxury Bag</h3>

                <div class="price">$150</div>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>

        </div>

    </section>

    <footer>
        © 2026 Luxury Shop. All Rights Reserved.
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
